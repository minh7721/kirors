services:
  kiro-rs:
    build: .
    image: minhhn77/kirors:latest
    container_name: kiro-rs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8990:8990"
    volumes:
      - ./config/:/app/config/
    restart: unless-stopped
    networks:
      - default
      - new-api-network

networks:
  new-api-network:
    external: true
    name: 123gateway_new-api-network
